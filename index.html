<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的個人行程與事項管理 (專業版)</title>
    <style>
        :root { --primary: #4A90E2; --bg-color: #F4F7F6; --card-bg: #FFFFFF; --text: #333333; --border: #E0E0E0; --danger: #E74C3C; --success: #2ECC71; --google: #4285F4; --warning: #F39C12;}
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); margin: 0; padding: 20px; height: 100vh; display: flex; flex-direction: column;}
        h1 { text-align: center; color: var(--primary); margin-top: 0; margin-bottom: 20px;}
        
        /* 容器與版面配置 */
        .container { display: flex; gap: 20px; max-width: 1300px; margin: 0 auto; flex: 1; min-height: 0; width: 100%; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; min-height: 0;}
        
        /* 左半部：事項清單 (比例 4:4:2) */
        .left-panel { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        .section-wrapper { display: flex; flex-direction: column; min-height: 0; background: #fff; border-radius: 8px;}
        .section-short { flex: 4; }
        .section-long { flex: 4; border-top: 2px dashed var(--border); padding-top: 10px;}
        .section-reminder { flex: 2; border-top: 2px dashed var(--border); padding-top: 10px;}
        
        /* 右半部：日曆 */
        .right-panel { flex: 1; }

        h2 { border-bottom: 2px solid var(--primary); padding-bottom: 8px; margin-top: 0; font-size: 1.1rem; display: flex; justify-content: space-between; align-items: center;}
        h2 span.subtitle { font-size: 0.85rem; color: #666; font-weight: normal; }
        
        /* 按鈕與輸入框 */
        #auth-btn { background: var(--google); color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 0.85rem; font-weight: bold;}
        .task-input-group { display: flex; gap: 8px; margin-bottom: 10px; align-items: center;}
        input[type="text"] { padding: 8px; border: 1px solid var(--border); border-radius: 5px; flex: 1; min-width: 0;}
        input[type="time"] { padding: 8px; border: 1px solid var(--border); border-radius: 5px; width: 110px;}
        button.add-btn { background: var(--success); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; white-space: nowrap;}
        
        .google-sync-label { font-size: 0.85rem; color: #555; display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap;}
        
        /* 列表樣式 (加入滾動條) */
        .task-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; padding-right: 5px;}
        .task-list::-webkit-scrollbar { width: 6px; }
        .task-list::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
        
        .task-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
        .task-item.completed .task-text { text-decoration: line-through; color: #999; }
        .task-content { display: flex; align-items: center; gap: 8px; flex: 1; overflow: hidden;}
        .task-text { font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .badge { font-size: 0.75rem; padding: 2px 6px; border-radius: 10px; white-space: nowrap;}
        .badge-time { background: #fff3cd; color: #856404; }
        .badge-google { background: #e8f0fe; color: var(--google); }
        .badge-alarm { background: #fce4ec; color: #c2185b; font-weight: bold;}
        
        .delete-btn { background: var(--danger); color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }

        /* 日曆樣式 */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .calendar-header button { cursor: pointer; background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 5px; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; }
        .day-name { font-weight: bold; color: #777; margin-bottom: 5px;}
        .day { padding: 12px 5px; background: #f9f9f9; border-radius: 5px; cursor: pointer; border: 1px solid transparent; position: relative; font-size: 1.1rem;}
        .day:hover { background: #e9e9e9; }
        .day.selected { border-color: var(--primary); background: #e3f2fd; font-weight: bold;}
        
        /* 日曆上的點點標記 */
        .dots-container { position: absolute; bottom: 4px; left: 0; right: 0; display: flex; justify-content: center; gap: 3px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; }
        .dot-task { background: var(--danger); }
        .dot-google { background: var(--google); }
        .dot-reminder { background: var(--warning); }
    </style>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer onload="gapiLoaded()"></script>
</head>
<body>

    <h1>📅 個人行程與事項管理</h1>

    <div class="container">
        
        <!-- 左半部：事項清單 -->
        <div class="card left-panel">
            
            <!-- 短期事項 (佔 40%) -->
            <div class="section-wrapper section-short">
                <h2>📌 短期事項 <span class="subtitle" id="selected-date-display1"></span></h2>
                <div class="task-input-group">
                    <input type="text" id="short-task-input" placeholder="新增今日行程...">
                    <input type="time" id="short-task-time">
                    <button class="add-btn" onclick="addTask('short')">新增</button>
                </div>
                <!-- 選擇是否同步到 Google -->
                <label class="google-sync-label" style="margin-bottom: 10px;">
                    <input type="checkbox" id="sync-google-checkbox"> 加入 Google 日曆 (需先連動)
                </label>
                <ul class="task-list" id="short-task-list"></ul>
            </div>

            <!-- 長期事項 (佔 40%) -->
            <div class="section-wrapper section-long">
                <h2>🎯 長期事項 <span class="subtitle">無特定日期</span></h2>
                <div class="task-input-group">
                    <input type="text" id="long-task-input" placeholder="新增長期目標或待辦...">
                    <button class="add-btn" onclick="addTask('long')">新增</button>
                </div>
                <ul class="task-list" id="long-task-list"></ul>
            </div>

            <!-- 提醒項目 (佔 20%) -->
            <div class="section-wrapper section-reminder">
                <h2>⏰ 提醒項目 <span class="subtitle" id="selected-date-display2"></span></h2>
                <div class="task-input-group">
                    <input type="text" id="reminder-task-input" placeholder="例如: 喝水、吃藥...">
                    <input type="time" id="reminder-task-time">
                    <button class="add-btn" onclick="addTask('reminder')" style="background: var(--warning);">提醒</button>
                </div>
                <ul class="task-list" id="reminder-task-list"></ul>
            </div>

        </div>

        <!-- 右半部：日曆 -->
        <div class="card right-panel">
            <h2>
                行事曆 
                <button id="auth-btn" onclick="handleAuthClick()">連動 Google 日曆</button>
            </h2>
            <div class="calendar-header">
                <button onclick="changeMonth(-1)">&#9664; 上個月</button>
                <span id="month-year-display" style="font-weight: bold; font-size: 1.2rem;"></span>
                <button onclick="changeMonth(1)">下個月 &#9654;</button>
            </div>
            <div class="days-grid" id="calendar-grid"></div>
        </div>

    </div>

    <script>
        // ==========================================
        // 🚨 請在這裡填入您的 Client ID 🚨
        // ==========================================
        const CLIENT_ID = '289982740072-5n5hn7e4d7mma6g5sgdii1mkustcenqd.apps.googleusercontent.com'; 
        
        const DISCOVERY_DOC = 'https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest';
        const SCOPES = 'https://www.googleapis.com/auth/calendar.events';
        
        let tokenClient;
        let isAuthorized = false;

        let tasks = JSON.parse(localStorage.getItem('myTasks')) || [];
        let googleEvents = []; 
        let currentDate = new Date();
        let selectedDate = new Date();

        // --- Google API 登入初始化 ---
        function gapiLoaded() { gapi.load('client', initializeGapiClient); }

        async function initializeGapiClient() {
            if(CLIENT_ID === '請把你的ClientID貼在這裡') return; // 防呆
            await gapi.client.init({ discoveryDocs: [DISCOVERY_DOC] });
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: async (resp) => {
                    if (resp.error) throw resp;
                    isAuthorized = true;
                    document.getElementById('auth-btn').innerText = '✅ 已連動 Google';
                    document.getElementById('auth-btn').style.background = 'var(--success)';
                    document.getElementById('sync-google-checkbox').checked = true; // 登入後預設打勾
                    await fetchGoogleEvents();
                },
            });
        }

        function handleAuthClick() { if (tokenClient) tokenClient.requestAccessToken({prompt: 'consent'}); }

        // --- 抓取 Google 日曆資料 ---
        async function fetchGoogleEvents() {
            try {
                let timeMin = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1).toISOString();
                let timeMax = new Date(currentDate.getFullYear(), currentDate.getMonth() + 2, 0).toISOString();
                
                const response = await gapi.client.calendar.events.list({
                    'calendarId': 'primary', 'timeMin': timeMin, 'timeMax': timeMax,
                    'showDeleted': false, 'singleEvents': true, 'orderBy': 'startTime'
                });
                
                googleEvents = response.result.items.map(event => {
                    let eventDate = event.start.dateTime ? event.start.dateTime.split('T')[0] : event.start.date;
                    let eventTime = event.start.dateTime ? event.start.dateTime.split('T')[1].substring(0,5) : '';
                    return { id: event.id, text: event.summary, type: 'short', date: eventDate, reminderTime: eventTime, completed: false, isGoogle: true };
                });
                renderTasks(); renderCalendar();
            } catch (err) { console.error("讀取 Google 日曆失敗:", err); }
        }

        // --- 新增事項 (短期、長期、提醒) ---
        async function addTask(type) {
            let inputId = type === 'short' ? 'short-task-input' : (type === 'long' ? 'long-task-input' : 'reminder-task-input');
            let inputEl = document.getElementById(inputId);
            let text = inputEl.value.trim();
            if (!text) return alert("請輸入事項內容！");

            let dateStr = formatDate(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate());
            
            // 處理時間
            let timeInput = '';
            if(type === 'short') timeInput = document.getElementById('short-task-time').value;
            if(type === 'reminder') {
                timeInput = document.getElementById('reminder-task-time').value;
                if(!timeInput) return alert("提醒項目必須設定時間！");
            }

            // 檢查是否要同步到 Google (只有短期事項有這個選項)
            let wantsGoogleSync = document.getElementById('sync-google-checkbox').checked;

            if (type === 'short' && isAuthorized && wantsGoogleSync) {
                // 寫入 Google 日曆
                const eventBody = { summary: text };
                if (timeInput) {
                    const startDateTime = new Date(`${dateStr}T${timeInput}:00`);
                    const endDateTime = new Date(startDateTime.getTime() + 60 * 60 * 1000); 
                    eventBody.start = { dateTime: startDateTime.toISOString(), timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone };
                    eventBody.end = { dateTime: endDateTime.toISOString(), timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone };
                } else {
                    let nextDay = new Date(selectedDate); nextDay.setDate(nextDay.getDate() + 1);
                    eventBody.start = { date: dateStr };
                    eventBody.end = { date: formatDate(nextDay.getFullYear(), nextDay.getMonth(), nextDay.getDate()) };
                }
                try {
                    await gapi.client.calendar.events.insert({ 'calendarId': 'primary', 'resource': eventBody });
                    inputEl.value = ''; document.getElementById('short-task-time').value = '';
                    await fetchGoogleEvents(); return;
                } catch(e) { console.error(e); alert("新增到 Google 失敗。"); }
            } else {
                // 寫入本機 LocalStorage (包含不勾選同步的短期、長期、提醒)
                const newTask = { id: Date.now(), text: text, type: type, completed: false };
                if (type === 'short' || type === 'reminder') { 
                    newTask.date = dateStr; 
                    if (timeInput) newTask.reminderTime = timeInput; 
                }
                if (type === 'reminder') newTask.notified = false; // 提醒用標記

                tasks.push(newTask);
                saveData();
                
                inputEl.value = '';
                if(type === 'short') document.getElementById('short-task-time').value = '';
                if(type === 'reminder') document.getElementById('reminder-task-time').value = '';
                
                renderTasks(); renderCalendar();
            }
        }

        // --- 刪除事項 (修復 BUG 版本) ---
        async function deleteTask(id, isGoogle) {
            if (isGoogle && isAuthorized) {
                if(confirm("確定要從 Google 日曆刪除此行程嗎？")) {
                    try {
                        await gapi.client.calendar.events.delete({ 'calendarId': 'primary', 'eventId': id });
                        await fetchGoogleEvents();
                    } catch(e) { console.error(e); alert("刪除Google行程失敗"); }
                }
            } else {
                // BUG 修復：將兩邊的 ID 都轉換為字串 (String) 再進行比對過濾
                tasks = tasks.filter(t => String(t.id) !== String(id));
                saveData(); renderTasks(); renderCalendar();
            }
        }

        // --- 打勾完成事項 ---
        function toggleTask(id) {
            const task = tasks.find(t => String(t.id) === String(id));
            if (task) { task.completed = !task.completed; saveData(); renderTasks(); renderCalendar(); }
        }

        function saveData() { localStorage.setItem('myTasks', JSON.stringify(tasks)); }

        // --- 渲染事項列表 ---
        function renderTasks() {
            const shortList = document.getElementById('short-task-list');
            const longList = document.getElementById('long-task-list');
            const reminderList = document.getElementById('reminder-task-list');
            shortList.innerHTML = ''; longList.innerHTML = ''; reminderList.innerHTML = '';

            const selectedDateStr = formatDate(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate());
            let allTasks = [...tasks, ...googleEvents];

            allTasks.forEach(task => {
                const li = document.createElement('li');
                li.className = `task-item ${task.completed ? 'completed' : ''}`;
                
                let badgeHTML = '';
                if(task.type === 'reminder') badgeHTML = `<span class="badge badge-alarm">⏰ ${task.reminderTime}</span>`;
                else if(task.reminderTime) badgeHTML = `<span class="badge badge-time">🔔 ${task.reminderTime}</span>`;
                
                let googleBadge = task.isGoogle ? `<span class="badge badge-google">Google</span>` : '';
                let checkboxHTML = task.isGoogle ? '' : `<input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask('${task.id}')">`;

                // 注意按鈕傳遞 ID 的方式，加上單引號避免數字格式問題
                li.innerHTML = `
                    <div class="task-content">
                        ${checkboxHTML}
                        <span class="task-text" title="${task.text}">${task.text}</span>
                        ${badgeHTML} ${googleBadge}
                    </div>
                    <button class="delete-btn" onclick="deleteTask('${task.id}', ${task.isGoogle ? 'true' : 'false'})">刪除</button>
                `;

                if (task.type === 'short' && task.date === selectedDateStr) shortList.appendChild(li);
                else if (task.type === 'long') longList.appendChild(li);
                else if (task.type === 'reminder' && task.date === selectedDateStr) reminderList.appendChild(li);
            });
        }

        // --- 日曆渲染 ---
        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const display = document.getElementById('month-year-display');
            grid.innerHTML = '';
            const year = currentDate.getFullYear(); const month = currentDate.getMonth();
            display.innerText = `${year}年 ${month + 1}月`;

            ['日', '一', '二', '三', '四', '五', '六'].forEach(d => { 
                const el = document.createElement('div'); el.className = 'day-name'; el.innerText = d; grid.appendChild(el); 
            });

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));

            for (let i = 1; i <= daysInMonth; i++) {
                const dayEl = document.createElement('div');
                dayEl.className = 'day'; dayEl.innerText = i;
                const dateStr = formatDate(year, month, i);
                
                if (dateStr === formatDate(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate())) dayEl.classList.add('selected');

                // 產生點點標記
                let dotsHTML = '<div class="dots-container">';
                if (tasks.some(t => t.type === 'short' && t.date === dateStr && !t.completed)) dotsHTML += '<div class="dot dot-task"></div>';
                if (tasks.some(t => t.type === 'reminder' && t.date === dateStr && !t.completed)) dotsHTML += '<div class="dot dot-reminder"></div>';
                if (googleEvents.some(t => t.date === dateStr)) dotsHTML += '<div class="dot dot-google"></div>';
                dotsHTML += '</div>';
                dayEl.innerHTML += dotsHTML;

                dayEl.onclick = () => { selectedDate = new Date(year, month, i); renderCalendar(); renderTasks(); };
                grid.appendChild(dayEl);
            }
            
            const selectedStr = `(${formatDate(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate())})`;
            document.getElementById('selected-date-display1').innerText = selectedStr;
            document.getElementById('selected-date-display2').innerText = selectedStr;
        }

        function changeMonth(dir) { currentDate.setMonth(currentDate.getMonth() + dir); renderCalendar(); if(isAuthorized) fetchGoogleEvents(); }
        function formatDate(year, month, day) { return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`; }

        // --- 提醒背景檢查 (每 10 秒檢查一次) ---
        setInterval(() => {
            const now = new Date();
            const currentStrDate = formatDate(now.getFullYear(), now.getMonth(), now.getDate());
            const currentStrTime = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
            let needsSave = false;

            tasks.forEach(task => {
                if (task.type === 'reminder' && !task.completed && task.date === currentStrDate && task.reminderTime === currentStrTime && !task.notified) {
                    alert(`⏰ 提醒時間到囉！\n\n項目：${task.text}`);
                    task.notified = true; 
                    needsSave = true;
                }
            });
            if (needsSave) saveData();
        }, 10000); 

        // --- 初始啟動 ---
        renderCalendar(); renderTasks();
    </script>
</body>
</html>
